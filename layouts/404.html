{{ define "main" }}
<p class="prompt-line"><span class="ps1"><span class="user">{{ site.Params.user }}@{{ site.Params.host }}</span>:<span class="path">~</span>$</span> <span class="cmd">cat <span id="missing-path">this-page</span></span></p>
<div class="output">
  <p class="error">cat: <span id="missing-path-echo">this-page</span>: No such file or directory</p>
  <p class="hint"># 404. Try <a href="{{ site.Home.RelPermalink }}">cd ~</a> to go home.</p>
</div>
{{ end }}
